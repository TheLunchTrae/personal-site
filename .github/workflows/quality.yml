name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: true
      - name: Install locked dependencies
        run: mise run ts:install
      - name: Run the mandatory gate
        run: mise run standards:check

  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: true
      - run: mise run ts:build
      - name: Build main for the before capture
        run: |
          BUN="$(mise which bun)"
          git fetch --depth=1 https://github.com/TheLunchTrae/personal-site.git main
          git worktree add ../before FETCH_HEAD
          cd ../before && "$BUN" install --frozen-lockfile && "$BUN" run build
      - name: Install Playwright
        working-directory: .capture
        run: echo "{\"name\":\"capture\",\"private\":true}" > package.json && npm i playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Capture
        working-directory: .capture
        run: |
          (cd ../out && python3 -m http.server 4310 >/dev/null 2>&1 &)
          (cd ../../before/out && python3 -m http.server 4311 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p out/shots
          node close.mjs
          echo "=== BUNDLE ==="; tar -czf - -C out shots | base64 -w 0; echo; echo "=== END BUNDLE ==="
