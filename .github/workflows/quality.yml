name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: true
      - name: Install locked dependencies
        run: mise run ts:install
      - name: Run the mandatory gate
        run: mise run standards:check

  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: true
      - run: mise run ts:build
      - name: Build main for the before audit
        run: |
          BUN="$(mise which bun)"
          git fetch --depth=1 https://github.com/TheLunchTrae/personal-site.git main
          git worktree add ../before FETCH_HEAD
          cd ../before && "$BUN" install --frozen-lockfile && "$BUN" run build
      - name: Install Playwright
        working-directory: .capture
        run: npm init -y >/dev/null && npm i playwright@1.56.1 && npx playwright install --with-deps chromium && sudo apt-get install -y ffmpeg >/dev/null
      - name: Audit and capture
        working-directory: .capture
        run: |
          (cd ../out && python3 -m http.server 4310 >/dev/null 2>&1 &)
          (cd ../../before/out && python3 -m http.server 4311 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p out/shots out/video
          BASE=http://localhost:4311 node audit.mjs > out/before.json
          node reach.mjs out/before.json > out/before.txt
          node audit.mjs > out/after.json
          node reach.mjs out/after.json | tee out/after.txt
          node shots.mjs
          for f in out/video/*.webm; do ffmpeg -loglevel error -y -i "$f" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "${f%.webm}.mp4" && rm "$f"; done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: always()
        with:
          name: capture
          path: .capture/out
